{% extends 'admin/base_admin.html' %}
{% block title %}Delete Movie{% endblock %}
{% block page_title %}Delete Movie{% endblock %}
{% block content %}
<div class="card-bms" style="max-width: 500px; margin: 0 auto;">
  <div class="card-bms-body text-center py-5">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
    <h4 class="mt-3">Delete "{{ object.name }}"?</h4>
    <p class="text-muted">This action cannot be undone. All related data will be deleted.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Yes, Delete</button>
      <a href="{% url 'admin_movie_list' %}" class="btn btn-outline-secondary ms-2">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

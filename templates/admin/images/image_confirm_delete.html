{% extends 'admin/base_admin.html' %}
{% block title %}Delete Image{% endblock %}
{% block page_title %}Delete Image{% endblock %}
{% block content %}
<div class="card-bms" style="max-width: 500px; margin: 0 auto;">
  <div class="card-bms-body text-center py-5">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
    <h4 class="mt-3">Delete this image?</h4>
    {% if object and object.image %}
    <img src="{{ object.image.url }}" alt="Preview" class="img-fluid rounded mb-3" style="max-height: 200px;">
    {% endif %}
    <form method="post">{% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, Delete</button>
      <a href="{% url 'admin_image_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

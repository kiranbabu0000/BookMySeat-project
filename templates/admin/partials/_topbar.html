<header class="admin-topbar">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm px-2 d-lg-none" type="button" onclick="toggleSidebar()" aria-label="Toggle sidebar" style="color: var(--text-secondary); border: 1px solid var(--border-color); border-radius: var(--radius-md);">
      <i class="bi bi-list fs-5"></i>
    </button>
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="{% url 'admin_dashboard' %}"><i class="bi bi-house-fill me-1"></i>Home</a></li>
        <li class="breadcrumb-item active" aria-current="page">
          {% block page_title %}Dashboard{% endblock %}
        </li>
      </ol>
    </nav>
  </div>
  <div class="d-flex align-items-center gap-2">
    <form class="search-form d-none d-md-block" method="GET" action="" role="search">
      <div class="search-input-wrap">
        <i class="bi bi-search search-input-icon"></i>
        <input type="text" name="search" class="form-control form-control-sm search-input" placeholder="Search..." value="{{ request.GET.search|default:'' }}" aria-label="Search">
      </div>
    </form>
    <a href="{% url 'admin_notification_list' %}" class="notification-badge btn btn-sm" title="Notifications" aria-label="Notifications" style="border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-secondary); position: relative;">
      <i class="bi bi-bell-fill"></i>
      {% if notifications > 0 %}
      <span class="badge rounded-pill bg-danger">{{ notifications }}</span>
      {% endif %}
    </a>
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
      <i class="bi bi-sun-fill" id="themeIcon"></i>
    </button>
    <div class="dropdown user-avatar-dropdown">
      <button class="btn btn-sm dropdown-toggle d-flex align-items-center gap-2" data-bs-toggle="dropdown" aria-expanded="false" style="border: 1px solid var(--border-color); border-radius: var(--radius-md); color: var(--text-primary); background: transparent; padding: 0.35rem 0.75rem;">
        <div class="user-avatar">
          {{ user.username|first|upper }}
        </div>
        <span class="d-none d-md-inline fw-medium" style="font-size: 0.85rem;">{{ user.username }}</span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><h6 class="dropdown-header fw-semibold" style="color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">{{ user.get_full_name|default:user.username }}</h6></li>
        <li><a class="dropdown-item" href="{% url 'admin_profile' %}"><i class="bi bi-person-circle me-2"></i>Profile</a></li>
        <li><a class="dropdown-item" href="{% url 'admin_settings' %}"><i class="bi bi-gear me-2"></i>Settings</a></li>
        <li><hr class="dropdown-divider" style="border-color: var(--border-color);"></li>
        <li><a class="dropdown-item text-danger" href="{% url 'admin_logout' %}"><i class="bi bi-box-arrow-left me-2"></i>Logout</a></li>
      </ul>
    </div>
  </div>
</header>

{% extends "base.html" %}
{% load static %}

{% block title %}Logged Out{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="container-bms">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
        <div class="auth-card text-center">
          <div class="auth-card__header">
            <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);">
              <i class="bi bi-box-arrow-right"></i>
            </div>
            <h1 class="h4 fw-bold mb-1" style="color: #ffffff;">Signed Out</h1>
            <p class="small mb-0" style="color: rgba(255,255,255,0.8);">You have successfully logged out</p>
          </div>

          <div class="auth-card__body p-4">
            <p class="text-secondary mb-4">Thank you for visiting BookMySeat. We hope to see you back for your next movie night!</p>
            <div class="d-flex flex-column gap-2">
              <a href="{% url 'login' %}" class="btn btn-bms-primary w-100 justify-content-center py-2.5 fw-semibold">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In Again
              </a>
              <a href="{% url 'home' %}" class="btn btn-bms-outline w-100 justify-content-center py-2 fw-semibold">
                <i class="bi bi-house me-1"></i> Back to Home
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

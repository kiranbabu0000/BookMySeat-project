{% extends 'admin/base_admin.html' %}
{% block title %}Delete Staff{% endblock %}
{% block page_title %}Delete Staff Member{% endblock %}
{% block content %}
<div class="card-bms" style="max-width: 500px; margin: 0 auto;">
  <div class="card-bms-body text-center py-5">
    <i class="bi bi-exclamation-triangle-fill text-danger" style="font-size: 3rem;"></i>
    <h4 class="mt-3">Delete Staff "{{ object.username }}"?</h4>
    <form method="post">{% csrf_token %}
      <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Yes, Delete</button>
      <a href="{% url 'admin_staff_list' %}" class="btn btn-outline-secondary">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}

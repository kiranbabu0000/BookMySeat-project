{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | BookMySeat</title>
  <meta name="description" content="BookMySeat Cinema Management Admin Login">
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'admin/css/admin.css' %}">
  <script src="{% static 'js/theme.js' %}"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0a0a0a 0%, #141414 50%, #1a0a0a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 40%, rgba(220, 38, 38, 0.06) 0%, transparent 50%),
                  radial-gradient(circle at 70% 60%, rgba(37, 99, 235, 0.04) 0%, transparent 50%);
      pointer-events: none;
    }
    .admin-login-page { width: 100%; padding: 2rem; position: relative; z-index: 1; }
    .login-card {
      max-width: 420px; margin: 0 auto; background: rgba(30, 30, 30, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 1.5rem;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6), 0 0 40px rgba(220, 38, 38, 0.05);
      overflow: hidden; backdrop-filter: blur(20px);
    }
    .login-header {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      padding: 2.5rem 2rem 2rem; text-align: center; color: #fff; position: relative;
    }
    .login-header::after {
      content: ''; position: absolute; bottom: -20px; left: 0; right: 0;
      height: 40px; background: rgba(30, 30, 30, 0.95);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .login-header .icon-wrap {
      width: 64px; height: 64px; border-radius: 50%; background: rgba(255, 255, 255, 0.15);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem; font-size: 1.75rem;
    }
    .login-header h1 {
      font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 1.5rem;
      margin: 0; letter-spacing: -0.02em;
    }
    .login-header p { opacity: 0.75; margin: 0.35rem 0 0; font-size: 0.85rem; font-weight: 400; }
    .login-body { padding: 2rem 2rem 1.5rem; position: relative; z-index: 1; }
    .form-floating > .form-control:focus ~ label { color: var(--accent-primary); }
    .form-control {
      background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0.75rem; padding: 0.85rem 1rem; color: #f8fafc;
      font-size: 0.9rem; transition: all 0.2s ease;
    }
    .form-control:focus {
      background: rgba(255, 255, 255, 0.06); border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.15); color: #f8fafc;
    }
    .form-control::placeholder { color: #64748b; font-size: 0.875rem; }
    .form-label { color: #94a3b8; font-weight: 500; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    .form-check-label { color: #94a3b8; font-size: 0.85rem; cursor: pointer; }
    .form-check-input { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.12); cursor: pointer; }
    .form-check-input:checked { background-color: var(--accent-primary); border-color: var(--accent-primary); }
    .btn-login {
      background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
      color: #fff; border: none; border-radius: 9999px; padding: 0.85rem;
      font-weight: 600; font-size: 0.95rem; width: 100%;
      transition: all 0.25s ease; letter-spacing: 0.01em;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #e50914 0%, #dc2626 100%);
      transform: translateY(-2px); box-shadow: 0 8px 30px rgba(220, 38, 38, 0.3);
      color: #fff;
    }
    .btn-login:active { transform: translateY(0); }
    .login-footer { text-align: center; padding: 0 2rem 2rem; }
    .login-footer a {
      color: #64748b; text-decoration: none; font-size: 0.85rem;
      transition: color 0.2s ease; display: inline-flex; align-items: center; gap: 0.4rem;
    }
    .login-footer a:hover { color: #f8fafc; }
    .login-divider { display: flex; align-items: center; gap: 1rem; margin: 1.25rem 0; color: #334155; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
    .login-divider::before, .login-divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.06); }
    .alert { background: rgba(220, 38, 38, 0.12); border: 1px solid rgba(220, 38, 38, 0.2); border-radius: 0.75rem; color: #fca5a5; font-size: 0.85rem; }
    .alert-success { background: rgba(22, 163, 74, 0.12); border-color: rgba(22, 163, 74, 0.2); color: #86efac; }
    .alert .btn-close { filter: brightness(0) invert(1); }
    @media (max-width: 480px) {
      .login-body { padding: 1.5rem; }
      .login-header { padding: 2rem 1.5rem 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="admin-login-page">
    <div class="login-card">
      <div class="login-header">
        <div class="icon-wrap">
          <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>Admin Portal</h1>
        <p>BookMySeat Management System</p>
      </div>
      <div class="login-body">
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
          <i class="bi bi-{% if message.tags == 'success' %}check-circle-fill{% else %}exclamation-triangle-fill{% endif %}"></i>
          {{ message }}
          <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}
        <form method="post" autocomplete="off">
          {% csrf_token %}
          <div class="mb-3">
            <label class="form-label" for="id_username">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: rgba(255,255,255,0.08); border-radius: 0.75rem 0 0 0.75rem;">
                <i class="bi bi-person-fill text-muted"></i>
              </span>
              <input type="text" name="username" id="id_username" class="form-control border-start-0" style="border-radius: 0 0.75rem 0.75rem 0;" placeholder="Enter your username" required autofocus>
            </div>
          </div>
          <div class="mb-4">
            <label class="form-label" for="id_password">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent border-end-0" style="border-color: rgba(255,255,255,0.08); border-radius: 0.75rem 0 0 0.75rem;">
                <i class="bi bi-lock-fill text-muted"></i>
              </span>
              <input type="password" name="password" id="id_password" class="form-control border-start-0" style="border-radius: 0 0.75rem 0.75rem 0;" placeholder="Enter your password" required>
            </div>
          </div>
          <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rememberMe" name="remember">
              <label class="form-check-label" for="rememberMe">Remember Me</label>
            </div>
          </div>
          <button type="submit" class="btn btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
          </button>
        </form>
      </div>
      <div class="login-footer">
        <a href="/"><i class="bi bi-arrow-left"></i>Back to Website</a>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

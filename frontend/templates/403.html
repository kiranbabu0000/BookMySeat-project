{% extends "base.html" %}
{% load static %}

{% block title %}Access Denied{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="container-bms">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-11 col-md-9 col-lg-7 col-xl-6" style="max-width: 560px; width: 100%;">
        <div class="auth-card text-center" style="animation: none;">
          <div class="auth-card__header">
            <div class="brand-icon mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem; border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.15); backdrop-filter: blur(10px);">
              <i class="bi bi-shield-exclamation"></i>
            </div>
            <h1 class="h4 fw-bold mb-1" style="color: #ffffff;">Access Denied</h1>
            <p class="small mb-0" style="color: rgba(255,255,255,0.8);">403</p>
          </div>

          <div class="auth-card__body p-4">
            <p class="text-secondary mb-4">You don't have permission to access this resource.</p>
            <div class="d-flex flex-column gap-2">
              <a href="{% url 'home' %}" class="btn btn-bms-primary w-100 justify-content-center fw-semibold" style="padding: 0.75rem 1.75rem;">
                <i class="bi bi-house me-1"></i> Back to Home
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

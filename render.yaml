# Render blueprint for BookMySeat.
# Deploy: connect this repo on https://dashboard.render.com and choose
# "Blueprint" (render.yaml is auto-detected), or run the Render CLI:
#   render blueprint launch
#
# The web service runs the Django backend from backend/ with Gunicorn.
# Static files are served by WhiteNoise (no separate web server needed).
# PostgreSQL is provisioned automatically and its connection string is
# injected into DATABASE_URL.

databases:
  - name: bookmyseat-db
    plan: free
    databaseName: bookmyseat

services:
  - type: web
    name: bookmyseat
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn bookmyseat.wsgi:application
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_TRUST_PROXY
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyseat-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: RAZORPAY_DEMO_MODE
        value: "False"
      # Add these in the Render dashboard (Environment tab) before going live.
      # Razorpay test keys:
      #   RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET / RAZORPAY_WEBHOOK_SECRET
      #   (set RAZORPAY_DEMO_MODE=False when keys are present)
      # SMTP email:
      #   EMAIL_HOST=smtp.gmail.com / EMAIL_PORT=587 / EMAIL_USE_TLS=True
      #   EMAIL_HOST_USER / EMAIL_HOST_PASSWORD / DEFAULT_FROM_EMAIL / SITE_URL

  # Email worker: confirmation emails are enqueued to movies.EmailOutbox during
  # booking and delivered by this cron job. Add the same DATABASE_URL + EMAIL_*
  # env vars to it in the Render dashboard (or via the blueprint below).
  - type: cron
    name: bookmyseat-email-worker
    runtime: python
    plan: free
    rootDir: backend
    schedule: "* * * * *"
    buildCommand: pip install -r requirements.txt
    command: python manage.py process_email_outbox --limit 50
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        fromService:
          name: bookmyseat
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyseat-db
          property: connectionString
      # Email settings must be added here too (same values as the web service):
      #   EMAIL_HOST / EMAIL_PORT / EMAIL_USE_TLS
      #   EMAIL_HOST_USER / EMAIL_HOST_PASSWORD / DEFAULT_FROM_EMAIL

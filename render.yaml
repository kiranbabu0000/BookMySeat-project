# Render blueprint for BookMySeat.
# Deploy: connect this repo on https://dashboard.render.com and choose
# "Blueprint" (render.yaml is auto-detected), or run the Render CLI:
#   render blueprint launch
#
# The web service runs the Django backend from backend/ with Gunicorn.
# Static files are served by WhiteNoise (no separate web server needed).
# PostgreSQL is provisioned automatically and its connection string is
# injected into DATABASE_URL.

databases:
  - name: bookmyseat-db
    plan: free
    databaseName: bookmyseat

services:
  - type: web
    name: bookmyseat
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn bookmyseat.wsgi:application
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Pin the Python runtime. Render's current default (3.14.x) has no wheels
      # for psycopg2-binary==2.9.12, and Django==6.0.7 needs Python >= 3.12.
      # Python 3.13.5 ships binary wheels for every pinned dependency.
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_TRUST_PROXY
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyseat-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: RAZORPAY_DEMO_MODE
        value: "False"
      # SMTP email (set the secret values in the Render dashboard — Environment
      # tab — on BOTH services; sync:false keeps them out of the repository).
      # Required: EMAIL_HOST_USER / EMAIL_HOST_PASSWORD / DEFAULT_FROM_EMAIL /
      # SITE_URL. Production refuses to boot without EMAIL_HOST rather than
      # silently falling back to the console backend (which sends nothing).
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_URL
        sync: false

  # Email worker: confirmation emails are enqueued to movies.EmailOutbox during
  # booking and delivered by this cron job (runs every minute).
  #
  # REQUIRED dashboard step (cannot be automated — these are sync:false secrets):
  # set EMAIL_HOST, EMAIL_HOST_USER, EMAIL_HOST_PASSWORD, DEFAULT_FROM_EMAIL and
  # SITE_URL in the Environment tab of THIS cron job (not just the web service).
  # settings.py raises ImproperlyConfigured at boot when DEBUG=False and
  # EMAIL_HOST is unset, so a missing secret makes this job fail every run and
  # confirmation emails stay pending forever in the outbox.
  - type: cron
    name: bookmyseat-email-worker
    runtime: python
    rootDir: backend
    schedule: "* * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py process_email_outbox --limit 50
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        fromService:
          name: bookmyseat
          type: web
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyseat-db
          property: connectionString
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_URL
        sync: false

# Render blueprint for BookMySeat.
# Deploy: connect this repo on https://dashboard.render.com and choose
# "Blueprint" (render.yaml is auto-detected), or run the Render CLI:
#   render blueprint launch
#
# The web service runs the Django backend from backend/ with Gunicorn.
# Static files are served by WhiteNoise (no separate web server needed).
# PostgreSQL is provisioned automatically and its connection string is
# injected into DATABASE_URL.

databases:
  - name: bookmyseat-db
    plan: free
    databaseName: bookmyseat

services:
  - type: web
    name: bookmyseat
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn bookmyseat.wsgi:application
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Pin the Python runtime. Render's current default (3.14.x) has no wheels
      # for psycopg2-binary==2.9.12, and Django==6.0.7 needs Python >= 3.12.
      # Python 3.13.5 ships binary wheels for every pinned dependency.
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_TRUST_PROXY
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: bookmyseat-db
          property: connectionString
      - key: DATABASE_SSL_REQUIRE
        value: "True"
      - key: RAZORPAY_DEMO_MODE
        value: "False"
      # Persistent media storage (Cloudinary). REQUIRED in production: Render's
      # disk is ephemeral, so without this every admin-uploaded poster/banner
      # is lost on the next restart/redeploy while PostgreSQL keeps its path.
      # When set, all ImageField uploads go to Cloudinary and survive restarts.
      # Set via the sync:false prompt so the secret stays out of the repo.
      # Format: cloudinary://<api_key>:<api_secret>@<cloud_name>
      - key: CLOUDINARY_URL
        sync: false
      # SMTP email. Production refuses to boot without EMAIL_HOST rather than
      # silently falling back to the console backend (which sends nothing), so
      # these secrets are required for the deploy even though the (optional)
      # email cron worker was removed to keep everything on Render's free tier.
      # Set EMAIL_HOST_USER / EMAIL_HOST_PASSWORD / DEFAULT_FROM_EMAIL / SITE_URL
      # via the sync:false prompts (they are kept out of the repository).
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_TIMEOUT
        value: "15"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_URL
        sync: false

